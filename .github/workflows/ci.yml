name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e (server + Playwright in one step)
        run: |
          pnpm exec next start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000 >/dev/null
          pnpm exec playwright test --grep-invert "db:"
      - name: e2e DB mode (workspace flows, embedded Postgres)
        run: |
          DATABASE_URL=pglite:./.pglite-e2e node scripts/e2e-seed.mjs
          E2E_DB=1 DATABASE_URL=pglite:./.pglite-e2e E2E_AUTH_USER_ID=user_preview pnpm exec next start -p 3110 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3110 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3110 >/dev/null
          E2E_DB=1 E2E_PORT=3110 pnpm exec playwright test --grep "db:" --workers=2
